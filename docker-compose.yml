version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: lpg-db
    environment:
      POSTGRES_DB: lpg_optimizer
      POSTGRES_USER: lpg_admin
      POSTGRES_PASSWORD: lpg_password_secure
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - lpg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lpg_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: lpg-cache
    ports:
      - "6379:6379"
    networks:
      - lpg-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lpg-backend
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://lpg_admin:lpg_password_secure@postgres:5432/lpg_optimizer
      REDIS_URL: redis://redis:6379/0
      API_PORT: 5000
      CORS_ORIGINS: http://localhost:3000,http://frontend:3000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lpg-network
    volumes:
      - ./backend/logs:/app/logs
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: lpg-frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - lpg-network
    restart: unless-stopped

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: lpg-proxy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - lpg-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  lpg-network:
    driver: bridge
